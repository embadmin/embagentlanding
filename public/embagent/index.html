<body>

  <!-- Home button now shows the home icon -->
<button onclick="goHome()" id="homeButton">
  <img
    src="icons/home.png"
    alt="Home"
  />
</button>

  <!-- Step Sections (unchanged except layout cleanup) -->
  <div id="step1" class="step active">
    <h2>Step 1: Pick Your Agent Icon</h2>
    <div class="icon-grid">
      <div class="icon-card" data-icon="chatbot.svg"><img src="../embagent/icons/chatbot.svg" alt="Chatbot Icon"></div>
      <div class="icon-card" data-icon="robot.png"><img src="../embagent/icons/robot.png" alt="Robot Icon"></div>
      <div class="icon-card" data-icon="robot-support.png"><img src="../embagent/icons/robot-support.png" alt="Support Robot Icon"></div>
      <div class="icon-card" data-icon="robot (1).png"><img src="../embagent/icons/robot (1).png" alt="Robot Icon"></div>
      <div class="icon-card" data-icon="robot (2).png"><img src="../embagent/icons/robot (2).png" alt="Robot Icon"></div>
      <div class="icon-card" data-icon="robot (3).png"><img src="../embagent/icons/robot (3).png" alt="Robot Icon"></div>
      <div class="icon-card" data-icon="chat.png"><img src="../embagent/icons/chat.png" alt="Chat Icon"></div>
      <div class="icon-card" data-icon="chat-info.png"><img src="../embagent/icons/chat-info.png" alt="Chat Info Icon"></div>
    </div>
    <div class="navigation">

      <button class="btn-primary" onclick="goToStep2()">
        <img src="icons/next.png" alt="Next" />
      </button>
    </div>
  </div>

  <div id="step2" class="step">
    <h2>Step 2: Name Your Agent</h2>
    <input type="text" id="agentName" placeholder="e.g. Zenon" />
    <div class="navigation">
      <button class="btn-secondary" onclick="goToStep1()">
        <img src="icons/back.png" alt="Back" />
      </button>
      <button class="btn-primary" onclick="goToStep3()">
        <img src="icons/next.png" alt="Next" />
      </button>
    </div>
  </div>

  <div id="step3" class="step">
    <h2>Step 3: What is your agent’s mission?</h2>
    <textarea id="agentMission" rows="4" placeholder="e.g. Customer Support, HR Help..."></textarea>
    <div class="navigation">
      <button class="btn-secondary" onclick="goToStep2()">
        <img src="icons/back.png" alt="Back" />
      </button>
      <button class="btn-primary" onclick="goToStep4()">
        <img src="icons/next.png" alt="Next" />
      </button>
    </div>
  </div>

  <div id="step4" class="step">
    <h2>Step 4: Train Your Agent</h2>
    <label for="agentExpertise">Expertise:</label>
    <input type="text" id="agentExpertise" placeholder="e.g. Shopify setup" />

    <label for="agentEtiquette">Tone:</label>
    <select id="agentEtiquette">
      <option value="Chill">Chill</option>
      <option value="Professional">Professional</option>
      <option value="Funny">Funny</option>
      <option value="Empathetic">Empathetic</option>
      <option value="Concise">Concise</option>
    </select>

    <label for="agentLinks">Helpful links:</label>
    <textarea id="agentLinks" placeholder="URLs separated by commas..."></textarea>

    <label for="knowledgeFile">Upload knowledge files:</label>
    <input type="file" id="knowledgeFile" multiple />
    <div class="navigation">
      <button class="btn-secondary" onclick="goToStep3()">
        <img
          src="icons/back.png"
          alt="Back"
           
        />
      </button>
      <button class="btn-primary" onclick="goToStep5()">
        <img
          src="icons/next.png"
          alt="Next"
           
        />
      </button>
    </div>
  </div>

  <div id="step5" class="step">
    <h2>Step 5: Confirm Agent</h2>
    <div id="agentSummary"></div>
    <div class="navigation">
      <button class="btn-secondary" onclick="goToStep4()">
        <img
          src="icons/back.png"
          alt="Back"
           
        />
      </button>
      <button class="btn-primary" onclick="submitAgent()">
        <img
          src="icons/create.png"
          alt="Next"
           
        />
      </button>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <!-- ─── Chat Screen (initially hidden) ───────────────────────── -->
<div id="chatScreen" class="">
  <!-- 1) HEADER: only avatar, name, info-toggle & close -->
  <div id="chatHeader">
    <!-- ── Left zone: Home + Start Over ─────────────────────────── -->
    <div class="header-left">
      <button id="homeButton" onclick="goHome()" title="Home">
        <img src="icons/home.png" alt="Home" />
      </button>
      <!-- <button id="startOver" onclick="goToStep1()" title="Start Over">
        <img src="icons/start-over.png" alt="Start Over" />
      </button> -->
    </div>
  
    <!-- ── Center zone: Avatar + Name ─────────────────────────── -->
    <div class="header-center">
      <img
        id="agentAvatar"
        src=""
        alt="Agent Avatar"
      />
      <span id="agentDisplayName">HELPER</span>
    </div>
  
    <!-- ── Right zone: Info ─────────────────────────────────────── -->
    <div class="header-right">
      <!-- Edit button first -->
      <button id="editButton" title="Edit">
        <img src="icons/edit.png" alt="Edit" />
      </button>
      <!-- Info button -->
      <button id="infoToggle" title="Agent Info">
        <img src="icons/info.png" alt="Info" />
      </button>
    </div>
  </div>

  <!-- 2) AGENT INFO PANEL: hidden until toggled -->
  <div id="agentInfo">
    <p id="agentMissionInfo"></p>
    <p id="agentFilesInfo"></p>
  </div>

  <!-- 3) MESSAGE AREA: scrollable -->
  <div id="chatBox"></div>

  <!-- 4) INPUT BAR: pinned to bottom -->
  <div id="chatInputArea">
    <input type="text" id="userInput" placeholder="Ask me anything..." />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

  
  <!-- ──────────────────────────────────────────────────────────── -->
  <!-- ─── Loading Overlay (hidden by default) ───────────────── -->
<!-- new -->
<div id="loadingOverlay">
  <div class="spinner"></div>
</div>
<!-- ─────────────────────────────────────────────────────────── -->
  <script src="script.js"></script>
</body>
</html>
